<footer class="site-footer">
    <div class="container footer-grid">
        <div>
            <p class="footer-brand">{{ site.name }}</p>
            <p>{{ ui.footer_about }}</p>
        </div>
        <div>
            <h2>{{ ui.footer_contact }}</h2>
            <p>{{ site.address }}</p>
            <p><a href="tel:{{ site.phone_uri }}" data-track="phone_click">{{ site.phone }}</a></p>
            <p><a href="mailto:{{ site.email }}" data-track="email_click">{{ site.email }}</a></p>
        </div>
        <div>
            <h2>{{ ui.footer_quote }}</h2>
            <p>{{ ui.footer_quote_body }}</p>
            <a class="text-link" href="{% url 'quote' %}" data-track-cta="footer_quote" data-cta-location="footer">{{ ui.footer_quote_link }}</a>
            <p><a class="text-link" href="{% url 'guide' %}" data-track-cta="footer_guide" data-cta-location="footer">{{ ui.footer_guide_link }}</a></p>
        </div>
    </div>
</footer>

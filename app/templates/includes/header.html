<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="{% url 'home' %}" aria-label="{{ site.name }}">
            <span class="brand-mark">K</span>
            <span>
                <strong>{{ site.name }}</strong>
                <small>{{ ui.brand_tagline }}</small>
            </span>
        </a>
        <nav class="nav" aria-label="{{ ui.nav_aria }}">
            {% for key, label, href in nav_items %}
                <a href="{{ href }}">{{ label }}</a>
            {% endfor %}
        </nav>
        <a class="header-phone" href="tel:{{ site.phone_uri }}" data-track="phone_click">{{ site.phone }}</a>
    </div>
</header>

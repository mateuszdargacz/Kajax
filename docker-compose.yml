version: "3.8"

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-kajax.eu,www.kajax.eu,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://kajax.eu,https://www.kajax.eu}
      DJANGO_SITE_URL: ${DJANGO_SITE_URL:-https://kajax.eu}
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/kajax.db}
      KAJAX_CONTACT_EMAIL: ${KAJAX_CONTACT_EMAIL:-mail@kajax.eu}
      KAJAX_LEAD_RECIPIENTS: ${KAJAX_LEAD_RECIPIENTS:-mail@kajax.eu}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Kajax Stolarstwo <mail@kajax.eu>}
      GTM_ID: ${GTM_ID:-}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    command: gunicorn config.wsgi:application --workers 2 --bind unix:///nginx/kajax.sock
    volumes:
      - ./app/:/app/
      - ./nginx/:/nginx/
      - ./data/:/app/data/
